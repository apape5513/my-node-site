<!-- We used the viewport tag in which we implemented to allow the website to adapt to a devices size which was implemented through the html skeleton added at the beggining -->

<!--The fonts I used are UnifrakturMaguntia & Grenze because I beleive they complemented each other quite well by not looking out of place when put together. I used a bold font weight as it made the headers stick out and be clear and visible.
I made the typograph responsive through using rem where the @media applies at anything below 600 pixles. I then optimized my images by using jpg as it is used best for photos, resizing and making them responsive through the use of lazy loading.
To ensure responsive design I made sure the page ajusts to the size of the screen and made sure to make all items ajustable based on broowser size which can be seen  throughout the site as the size is ajusted.-->

<!--We used css variables to improve the visual design and consitency throughout the website. The element that uses transform/translate is what allows the image to hover when your mouse is hoverd over them. Our animation allow the navbar at the top of the page to fade in whenever the page is loaded.-->

    <script>
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }
        const songImage = document.getElementById("song-image");
        const songName = document.getElementById("song-name");
        const songArtist = document.getElementById("song-artist");

        const songSlider = document.getElementById("slider-song");

        const playpauseButton = document.getElementById("playpause-song");
        const prevSongButton = document.getElementById("prev-song");
        const nextSongButton = document.getElementById("next-song");

        const songs = [
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",

            },

                artist: "Whitechapel",
                audio: "./Hymns in Dissonance.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Diabolic Slumber",
                artist: "Whitechapel",
                audio: "./Diabolic Slumber.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "A Visceral Retch",
                artist: "Whitechapel",
                audio: "./A Visceral Retch.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Ex Infernis",
                artist: "Whitechapel",
                audio: "./Ex Infernis.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Hate Cult Ritual",
                artist: "Whitechapel",
                audio: "./Hate Cult Ritual.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "The Abysmal Gospel",
                artist: "Whitechapel",
                audio: "./The Abysmal Gospel.mp3"
            },

            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Bedlam",
                artist: "Whitechapel",
                audio: "./Bedlam.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Mammoth God",
                artist: "Whitechapel",
                audio: "./Mammoth God.mp3"
            },
            {
                image: "https://th.bing.com/th/id/OIP._q30NZNNFsVLBD8vBLvYNAHaHa?w=173&h=180&c=7&r=0&o=7&pid=1.7&rm=3",
                name: "Nothing Is Coming for Any of Us",
                artist: "Whitechapel",
                audio: "./Nothing Is Coming for Any of Us.mp3"
            },
        ];

        const audio = document.createElement("audio");
        let currentSongIndex = 0;

        updateSong();

        prevSongButton.addEventListener("click", function () {
            if (currentSongIndex == 0) {
                return;
            }
            currentSongIndex--;
            updateSong();
        });

        nextSongButton.addEventListener("click", function () {
            if (currentSongIndex == songs.length - 1) {
                return;
            }
            currentSongIndex++;
            updateSong();
        });

        playpauseButton.addEventListener("click", function () {
            if (!audio.paused) {
                audio.pause();
            }
            else {
                audio.play();
            }
        });

        function updateSong() {
            const song = songs[currentSongIndex];
            songImage.src = song.image;
            songName.innerText = song.name;
            songArtist.innerText = song.artist;

            audio.src = song.audio;
            audio.onloadedmetadata = function () {
                songSlider.value = 0;
                songSlider.max = audio.duration;
            };
        }

        songSlider.addEventListener("change", function () {
            audio.currentTime = songSlider.value;
        })

        function moveSlider() {
            songSlider.value = audio.currentTime;
        };

        setInterval(moveSlider, 1000);



    </script>
